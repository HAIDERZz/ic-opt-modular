# IC-Opt spec: the WHAT of the design problem. How to run it lives in the recipe.
# The testbenches are Maestro exports of the MixerCS_* cells: their top-level `parameters` lines carry these eight
# variables. Another mixer's exports carry other parameters (F, W, L, VB_LO, VB_RF but no FCS / WCS / LCS, for one):
# check each export's `parameters` line before reusing the variables, and `--plan` reports one an export lacks.
project: mixer_multi_tb_opt
description: Optimize one Mixer candidate across CG/NF/BW, IIP3 and P1dB testbenches plus TT/SS/FF corners

testbenches:
  - id: cg_nf
    maestro_point_root: /home/username/simulation/Virtuoso_Bridge_test/MixerCS_PSS_CG_Noise/maestro/results/maestro/Interactive.N/1/Mixer_CS_CG_NF
    virtuoso_library: Virtuoso_Bridge_test
    cell: MixerCS_PSS_CG_Noise
    test_name: Mixer_CS_CG_NF
  - id: iip3
    maestro_point_root: /home/username/simulation/Virtuoso_Bridge_test/MixerCS_PSS_IIP3/maestro/results/maestro/Interactive.N/1/Mixer_CS_IIP3
    virtuoso_library: Virtuoso_Bridge_test
    cell: MixerCS_PSS_IIP3
    test_name: Mixer_CS_IIP3
  - id: p1db
    maestro_point_root: /home/username/simulation/Virtuoso_Bridge_test/MixerCS_PSS_P1dB/maestro/results/maestro/Interactive.N/1/Mixer_CS_P1dB
    virtuoso_library: Virtuoso_Bridge_test
    cell: MixerCS_PSS_P1dB
    test_name: Mixer_CS_P1dB

# Optional. Omit the whole section to simulate only at the source point's corner.
# `options` sets values on the netlist's `simulatorOptions` statement: ADE exports write the simulation temperature
# there as a literal (`temp=27`) that the declared `temperature` parameter does not drive, so `temp` goes here.
corners:
  - id: tt
    model_section: Post_simu_top_tt
    options: { temp: "27" }
  - id: ss
    model_section: Post_simu_top_ss
    options: { temp: "125" }
  - id: ff
    model_section: Post_simu_top_ff
    options: { temp: "-40" }
corner_policy:
  objective: worst_case
  constraints: all_corners

variables:
  - { name: F,     kind: integer,         lower: "20",   upper: "30",   step: "2" }
  - { name: W,     kind: continuous_step, lower: 0.6u,   upper: 1.2u,   step: 0.2u }
  - { name: L,     kind: continuous_step, lower: 30n,    upper: 40n,    step: 10n }
  - { name: VB_LO, kind: continuous_step, lower: 280m,   upper: 400m,   step: 20m }
  - { name: FCS,   kind: integer,         lower: "40",   upper: "56",   step: "2" }
  - { name: WCS,   kind: continuous_step, lower: 0.6u,   upper: 1.2u,   step: 0.2u }
  - { name: LCS,   kind: continuous_step, lower: 30n,    upper: 50n,    step: 10n }
  - { name: VB_RF, kind: continuous_step, lower: 300m,   upper: 440m,   step: 20m }

metrics:
  # The -3 dB bandwidth of the conversion gain. ADE's `bandwidth(<gain> 3 "low")` returns a waveform object, which the
  # extract stage refuses as non_scalar (N-35, 2026-09-27); `cross` gives the frequency where the gain sits 3 dB under its
  # peak, and the `if(car(errset(...)))` makes it total: where the gain never falls 3 dB inside the swept window the
  # bandwidth is at least the window, whose far edge is `xmin` of this falling curve.
  - name: BW
    unit: Hz
    testbench: cg_nf
    expression: if(car(errset(cross(db((harmonic((v("/IF_P" ?result "pac") - v("/IF_N" ?result "pac")) '-1) / harmonic(drplPacVolGnExpDen("(v(\"/RF_P\" ?result \"pac\")-v(\"/RF_N\" ?result \"pac\"))" '(0) nil) '-1))) (ymax(db((harmonic((v("/IF_P" ?result "pac") - v("/IF_N" ?result "pac")) '-1) / harmonic(drplPacVolGnExpDen("(v(\"/RF_P\" ?result \"pac\")-v(\"/RF_N\" ?result \"pac\"))" '(0) nil) '-1)))) - 3) 1 "either") t)) then car(errset(cross(db((harmonic((v("/IF_P" ?result "pac") - v("/IF_N" ?result "pac")) '-1) / harmonic(drplPacVolGnExpDen("(v(\"/RF_P\" ?result \"pac\")-v(\"/RF_N\" ?result \"pac\"))" '(0) nil) '-1))) (ymax(db((harmonic((v("/IF_P" ?result "pac") - v("/IF_N" ?result "pac")) '-1) / harmonic(drplPacVolGnExpDen("(v(\"/RF_P\" ?result \"pac\")-v(\"/RF_N\" ?result \"pac\"))" '(0) nil) '-1)))) - 3) 1 "either") t)) else xmin(db((harmonic((v("/IF_P" ?result "pac") - v("/IF_N" ?result "pac")) '-1) / harmonic(drplPacVolGnExpDen("(v(\"/RF_P\" ?result \"pac\")-v(\"/RF_N\" ?result \"pac\"))" '(0) nil) '-1)))))
  - name: MAX_GAIN
    unit: dB
    testbench: cg_nf
    expression: ymax(db((harmonic((v("/IF_P" ?result "pac") - v("/IF_N" ?result "pac")) '-1) / harmonic(drplPacVolGnExpDen("(v(\"/RF_P\" ?result \"pac\")-v(\"/RF_N\" ?result \"pac\"))" '(0) nil) '-1))))
  - name: NF_3G
    unit: dB
    testbench: cg_nf
    expression: value(getData("NF" ?result "pnoise") 3e+09)
  - name: IIP3
    unit: dBm
    testbench: iip3
    expression: rapidIIPN("pac_ip3")
  # The input-referred 1 dB compression point. `compressionVRI` returns nil where the gain has not fallen 1 dB at the
  # sweep's last input power (N-51, 2026-09-28: 6 of 80 points, the low-gain ones); `or` then gives that last power, read
  # from the data (`xmax(xval(w))` is the largest x of `w`), so the value means "at least" there.
  - name: P1dB
    unit: dBm
    testbench: p1db
    expression: or(compressionVRI((v("/IF_P" ?result "pss_fd") - v("/IF_N" ?result "pss_fd")) '1 ?rport resultParam("PORT2:r" ?result "pss_fd") ?gcomp 1) xmax(xval(harmonic((v("/IF_P" ?result "pss_fd") - v("/IF_N" ?result "pss_fd")) '1))))

constraints:
  - { metric: BW,       op: gt, value: 28e9 Hz }
  - { metric: MAX_GAIN, op: gt, value: 5.5 dB }
  - { metric: NF_3G,    op: lt, value: 9 dB }
  - { metric: IIP3,     op: gt, value: 1 dBm }
  - { metric: P1dB,     op: gt, value: -6 dBm }

objective:
  direction: minimize
  expression: -(0.1*min(max(0,min(1,10*(ln(BW/28e9)/ln(10))/0.6)),max(0,min(1,(MAX_GAIN-5.5)/2)),max(0,min(1,(9-NF_3G)/0.7)),max(0,min(1,(IIP3-1)/2)),max(0,min(1,(P1dB+6)/1.5)))+0.8*(0.1*max(0,min(1,10*(ln(BW/28e9)/ln(10))/0.6))+0.10*max(0,min(1,(MAX_GAIN-5.5)/2))+0.30*max(0,min(1,(9-NF_3G)/0.7))+0.20*max(0,min(1,(IIP3-1)/2))+0.30*max(0,min(1,(P1dB+6)/1.5))))

simulator:                # the resource fields are required and have no defaults
  preset: ax
  threads_per_run: 10     # placeholder: Spectre threads per simulation on your host
  parallel_jobs: 10       # placeholder: simulations at once, within the host's ~/.ic-opt/site.yaml entry
  timeout_s: 7200         # placeholder: one simulation's time limit
  # license_queue_timeout_s: <seconds>   # optional: Spectre's +lqtimeout; left out, Spectre's own license queue wait

budget:
  max_simulations: 300
