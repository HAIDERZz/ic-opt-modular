# AnalogGym benchmark registry (T17.0a-B2). AnalogGym (Chen et al., CODA-Team/AnalogGym, BSD-3-Clause,
# https://github.com/CODA-Team/AnalogGym, commit 0a9d1390ade361e2b4a2d33181e22367edbb8afc) is not vendored here --
# `benchmarks/fetch_analoggym.py` fetches it. This file quotes AnalogGym's own variable ranges, targets and
# authors' designs (with attribution below) for the circuits whose 5-pin netlist under Amplifier/spice_netlist/ or
# Low Dropout Regulator/spice_netlist/ we can actually simulate with ngspice.
#
# Every amplifier's 5-pin subckt is `gnda vdda vinn vinp vout`; bias is the internal source
# `I0 ... 'CURRENT_0_BIAS'`. `case` says where a circuit's ranges/targets come from:
#   rl            -- RGNN_RL/AMP_<x>.py + RGNN_RL/ckt_graphs.py give per-circuit ranges, targets, and (mostly
#                    placeholder, see below) authors_design.
#   graph_only    -- RGNN_RL/ckt_graphs.py has a class with real ranges+targets but no AMP_<x>.py script, so no
#                    authors_design.
#   generic_fallback -- neither exists; ranges follow the task's fallback rule (W 0.5..10um, L 0.5..5um step
#                    0.01, M 1..50 integer step 1, bias current 1..30uA step 0.1u, cap 0.5..30pF step 0.1p,
#                    resistor a decade around its design_variables placeholder), targets are the mode/median of
#                    the 13 RL amplifiers' own targets.
#
# `authors_design` for the 13 "rl" amplifiers is the literal `_initialize_simulation` array in AMP_<x>.py, mapped
# to netlist parameter names -- but for 12 of the 13 that array is `(W=1, L=1, M=4, ...)` repeated, i.e. the RL
# environment's generic reset point, NOT a tuned design (verified against the file; only Leung_NMCF_Pin_3's array
# holds genuinely fitted floats, matching the working hand-run trial in
# optimizer_research/benchmarks_data/trial_nmcf/). Role matching for Yan_AZ_Pin_3 is by (role, W/L multiplier)
# suffix, not by transistor index: AMP_AZ.py's own `.param` lines use transistor indices (e.g. `MOSFET_7_2_..._gm1
# _PMOS`) that no longer match this netlist's numbering (`MOSFET_9_2_..._gm1_PMOS`), while the role+multiplier
# pair is unchanged and unambiguous -- a real repo-drift case, not a transcription choice.
#
# Peng_TCFC_Pin_3 uses ckt_graphs.py's `GraphAMPTCFC` (no RL script exists for it, so no authors_design).
# Qu_LEC_Pin_3 is EXCLUDED from this registry entirely: AnalogGym/Amplifier/spice_netlist/Qu_LEC_Pin_3 is a 0-byte
# file at the pinned commit -- there is no `.subckt` to simulate.
#
# LDOs: LDO_TB.py / GraphLDOtestbench's per-transistor ranges name a "Basic_LDO" netlist revision that no longer
# matches any of the four shipped LDOs by parameter name (verified: ldo_1's own spice_netlist/ldo_1_vars.spice
# uses W_M0..W_M8, not LDO_TB.py's mosfet_0_8_w_biascm_pmos scheme) -- all four LDOs therefore use the
# generic-fallback range policy (a decade-ish band around each LDO's own shipped *_vars.spice value; that shipped
# value is `authors_design`; tied parameters such as `W_M1=W_M0` are left as ties, not separate variables). All
# four reuse LDO_TB.py's targets (LDR, LNR, PSRR, GBW, PM, Power, VOS, undershoot/overshoot) as the closest
# available reference, since AnalogGym gives no other LDO targets.
