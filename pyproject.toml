[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-auto-opt-workflow"
version = "0.2.0"
description = "Composable blocks and recipes for Spectre/OCEAN design optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "typer>=0.12",
]

[project.optional-dependencies]
turbo = [                      # only the `turbo` strategy needs torch (vendor/TuRBO); OpenBox and sobol/random do not
    "torch>=2.0",
    "gpytorch>=1.11",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
em = [                         # EM stages: the pcell geometry library and the DRC audit are built on klayout
    "klayout>=0.30",
]
report = [                     # parameter-importance section of analyze.report (pins keep numpy < 2 for open-box)
    "shap==0.49.1",
    "lightgbm==4.6.0",
]
prf = [                        # OpenBox `openbox_prf_eic` surrogate; needs swig to build
    "pyrfr==0.9.0",
]

[project.scripts]
ic-opt = "ic_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ic_opt.em.pcell" = ["profiles/*/rule.yaml", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# the geometry library moved from em-opt as-is; style-only findings are not worth diverging its history
"src/ic_opt/em/pcell/*" = ["ISC004", "C408", "C402", "RUF046", "RUF007", "RUF059", "TRY004", "B023", "BLE001", "PIE810"]
"tests/ic_opt/pcell/*" = ["ISC004", "C408", "C402", "RUF046", "RUF007", "RUF059", "TRY004", "B023", "BLE001", "PIE810"]
